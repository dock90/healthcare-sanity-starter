name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Public values, the demo dataset is public-read. Forks: set your own.
  NEXT_PUBLIC_SANITY_PROJECT_ID: pujyaf11
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: "2026-08-01"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # Cloudflare's documented always-pass test keys.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
  FORM_WEBHOOK_URL: http://localhost:3999/

jobs:
  check:
    name: Typecheck · lint · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typegen
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Playwright smoke + axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
        env: { CI: true }
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }

  lighthouse:
    name: Lighthouse CI budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run start -- -p 3000 &
      - run: npx wait-on http://localhost:3000 --timeout 60000
      - run: npm run lhci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
